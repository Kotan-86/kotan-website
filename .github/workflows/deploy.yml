# 仕様: docs/spec/pbi-001-site-exists.md#受入基準 (AC-13, AC-14, AC-15)
# 公開IF: .work/sprint-001-initial-launch/pbi-001/tasks.md の「公開IF」1-T3行を参照。
# Node.jsバージョンは decisions.md の D-1 により 22系(LTS以上)に変更されている
# (tasks.md 初期案の Node 20 から変更。1-T1 の astro@^7.3.3 が Node >=22.12.0 を要求するため)。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
